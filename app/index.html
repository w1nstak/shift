<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>Shift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css?v=20260925" />
  </head>
  <body>
    <div class="app" id="app">
      <div class="ambient" aria-hidden="true">
        <span class="ambient__orb ambient__orb--a"></span>
        <span class="ambient__orb ambient__orb--b"></span>
        <span class="ambient__grain"></span>
      </div>

      <div class="screens">
        <main class="screen screen--home is-active" data-screen="home" id="screen-home">
          <section class="hero" id="hero-root" aria-label="Shift"></section>
          <section class="features" id="features-root" aria-label="Возможности"></section>
          <section class="cta-band" id="cta-root" aria-label="Действие"></section>
        </main>

        <main class="screen screen--games" data-screen="games" id="screen-games" hidden>
          <header class="screen-head">
            <p class="screen-kicker">Арена</p>
            <h2 class="screen-title">Игры</h2>
          </header>
          <div class="game-grid" id="games-root"></div>
        </main>

        <main class="screen screen--profile" data-screen="profile" id="screen-profile" hidden>
          <header class="screen-head">
            <p class="screen-kicker">Iris</p>
            <h2 class="screen-title">Профиль</h2>
          </header>
          <div class="profile-stack" id="profile-root"></div>
        </main>
      </div>

      <nav class="bottom-nav" id="nav-root" aria-label="Навигация"></nav>
    </div>

    <div class="toast-host" id="toast-host" aria-live="polite"></div>
    <script src="app.js?v=20260925"></script>
  </body>
</html>
